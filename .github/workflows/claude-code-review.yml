name: Claude Code Review

# Reviews a PR once, when it is marked "Ready for review". PRs start as drafts,
# so pushes while the work is in progress do not trigger a review. To review
# again, convert the PR back to draft and mark it ready again.
#
# Before the review the job runs the same checks as CI on the PR head and hands
# the results to Claude. Claude posts one comment with a coverage table and
# files every finding (bugs, improvements, nits) as a GitHub issue labelled
# `code-review`. Comment `@claude` on an issue to have it fixed (claude.yml).
# Informational only: it never blocks a merge.

on:
  pull_request:
    types: [ready_for_review]
    paths-ignore:
      - 'package-lock.json'
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to review'
        required: true
        type: number

# One review per PR at a time; a second trigger waits instead of running twice in parallel.
concurrency:
  group: claude-review-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: false

jobs:
  claude-review:
    # Fork PRs get no secrets.
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true # review is informational; never block merges
    permissions:
      contents: read
      pull-requests: write
      issues: write # findings are filed as issues
      id-token: write # claude-code-action verifies the workflow via OIDC

    steps:
      - name: Resolve PR context
        id: pr_context
        # Untrusted context goes through env, never straight into run:.
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER_INPUT: ${{ github.event.pull_request.number || inputs.pr_number }}
          REPO: ${{ github.repository }}
        run: |
          PR_NUMBER="$PR_NUMBER_INPUT"
          if [[ -z "$PR_NUMBER" ]]; then
            echo "::error::No PR number available. Supply pr_number when triggering manually."
            exit 1
          fi
          PR_JSON=$(gh api "repos/${REPO}/pulls/${PR_NUMBER}")
          if [[ "$(echo "$PR_JSON" | jq -r '.head.repo.full_name')" != "$REPO" ]]; then
            echo "::error::Refusing to review a fork PR."
            exit 1
          fi
          echo "pr_number=${PR_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "pr_url=$(echo "$PR_JSON" | jq -r '.html_url')" >> "$GITHUB_OUTPUT"
          echo "base_ref=$(echo "$PR_JSON" | jq -r '.base.ref')" >> "$GITHUB_OUTPUT"
          echo "head_sha=$(echo "$PR_JSON" | jq -r '.head.sha')" >> "$GITHUB_OUTPUT"

      # Check out the PR head, also for manual runs (the default ref there is
      # main, so the review would read the wrong code). No stored credentials:
      # the PR's own code runs in the next step.
      - name: Checkout PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.pr_context.outputs.head_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Guard — skip if this review workflow itself changed
        id: guard
        # claude-code-action checks this file against the default branch, so a
        # PR that edits it cannot be reviewed by it.
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr_context.outputs.pr_number }}
          REPO: ${{ github.repository }}
        run: |
          count=$(gh api "repos/${REPO}/pulls/${PR_NUMBER}/files" --paginate \
            --jq '[.[] | select(.filename == ".github/workflows/claude-code-review.yml")] | length')
          if [[ "$count" -gt 0 ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping Claude Code Review — this PR modifies claude-code-review.yml itself."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.guard.outputs.skip != 'true'
        with:
          node-version: '26'
          cache: npm

      # The review agent has no permission to run code, so the checks run here
      # and their results go into the prompt as a file. A failing check does
      # not stop the job; Claude reports it.
      - name: Run checks on the PR head
        if: steps.guard.outputs.skip != 'true'
        env:
          OUT: ${{ runner.temp }}/checks.md
        run: |
          set +e # record every check, even after one fails
          npm ci --no-audit --no-fund > "$RUNNER_TEMP/npm-ci.log" 2>&1 || {
            echo "::warning::npm ci failed"; tail -50 "$RUNNER_TEMP/npm-ci.log"; }

          echo "# Check results for this PR head" > "$OUT"
          run_check() {
            local name="$1" dir="$2"; shift 2
            local log="$RUNNER_TEMP/check-$(echo "$name" | tr 'A-Z' 'a-z' | tr -c 'a-z0-9' '-').log"
            (cd "$dir" && "$@") > "$log" 2>&1
            local code=$?
            if [[ $code -eq 0 ]]; then status="PASS"; else status="FAIL (exit $code)"; fi
            echo "${name}: ${status}"
            {
              echo
              echo "## ${name} — ${status}"
              echo
              echo "Command: \`(cd ${dir} && $*)\`"
              echo
              echo '```'
              tail -n 80 "$log"
              echo '```'
            } >> "$OUT"
          }
          run_check "ESLint" . npx eslint . --max-warnings=0
          run_check "Apps Script check" . npm run check:manifest
          run_check "Tests (legacy src/)" . npm test
          run_check "Type check" . npm run typecheck
          run_check "Tests (bank-sync)" bank-sync npm test

      - name: Ensure review labels exist
        if: steps.guard.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh label create code-review --color 0075ca --description "Found during Claude code review" --repo "$REPO" 2>/dev/null || true
          gh label create blocking    --color b60205 --description "Bug, security or data-loss finding" --repo "$REPO" 2>/dev/null || true
          gh label create enhancement --color a2eeef --description "Improvement or suggestion" --repo "$REPO" 2>/dev/null || true
          gh label create nits        --color d4c5f9 --description "Style and minor nits" --repo "$REPO" 2>/dev/null || true

      - name: Run Claude Code Review
        if: steps.guard.outputs.skip != 'true'
        uses: anthropics/claude-code-action@16f9f71ab9c490faf367f94dd294897edc25be33 # v1.0.261
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ steps.pr_context.outputs.pr_number }}
            PR URL: ${{ steps.pr_context.outputs.pr_url }}
            BASE BRANCH: ${{ steps.pr_context.outputs.base_ref }}
            HEAD COMMIT: ${{ steps.pr_context.outputs.head_sha }}
            CHECK RESULTS: ${{ runner.temp }}/checks.md

            Review this pull request against the repository's CLAUDE.md. This repo holds
            two independent Google Apps Script projects (V8 runtime, files loaded in
            .clasp.json filePushOrder) that handle personal bank data: the legacy
            project in src/ (Plaid, SaltEdge, namespace FinancialPlanner) and bank-sync/
            (Enable Banking, own .clasp.json, namespace BankSync, Node tests under
            bank-sync/test; see docs/BANK_SYNC_ROADMAP.md). Judge each file against the
            project it belongs to. Be constructive and specific.

            The working directory is a checkout of the PR head commit. Read the diff
            with `gh pr diff ${{ steps.pr_context.outputs.pr_number }}` and open the
            surrounding code with Read/Grep before judging it; cite line numbers from
            the files, not from the diff.

            The workflow already ran lint, the Apps Script check, both test suites and
            the type check on this commit. Read the CHECK RESULTS file first and report
            it in the CI row. A failing check is a 🔴 finding. Do not claim you could
            not run the tests; quote the pass/fail counts from that file.

            Check every category below. Prefix each finding with its tag. For
            categories with nothing to report, still list them as ✅ in the table.

            **Correctness & safety**
            - **[CI]** — results from the CHECK RESULTS file
            - **[Bugs]** — logic errors, edge cases, wrong sheet/column assumptions
            - **[Security]** — escaping of anything rendered through HtmlService, input from
              e.parameter / google.script.run, signature handling for SaltEdge/Plaid
            - **[Secrets]** — API keys, tokens or the SaltEdge private key stored anywhere
              other than PropertiesService, or committed to the repo
            - **[PII]** — transaction, account or balance data written to Logger/console,
              error sheets or URLs
            - **[Money]** — floating-point arithmetic on amounts, sign conventions
              (expenses are negative), rounding, currency formats
            - **[Data-loss]** — clearing or overwriting user sheets, irreversible deletes

            **Apps Script platform**
            - **[Batching]** — getValue/setValue/getRange inside loops instead of one
              getValues/setValues (Apps Script's N+1)
            - **[Quotas]** — risk of the 6-minute execution limit, UrlFetchApp quotas,
              missing pagination limits or LockService where concurrency matters
            - **[Scopes]** — new or broader oauthScopes in appsscript.json (each one is a
              new permission the user must grant)
            - **[Load-order]** — new files missing from filePushOrder, or modules that read
              FinancialPlanner.X at load time before X's file has loaded
            - **[Globals]** — duplicate top-level names across files (the last one loaded
              silently wins), menu items pointing at functions that don't exist
            - **[API]** — calls to Apps Script methods or enum values that don't exist

            **Design & quality**
            - **[DRY]**, **[KISS]**, **[YAGNI]**, **[SRP]** — see docs/DEVELOPMENT_PRINCIPLES.md
            - **[Naming]**, **[Dead-code]**, **[Constants]** (magic sheet names/columns that
              belong in core/config.js)
            - **[Tests]** — new logic without a test: src/tests/ using gas-fakes.js for the
              legacy project, bank-sync/test/*.test.js for bank-sync

            ### Step 1 — File every finding as an issue

            Classify each finding:
            - 🔴 **blocking** (failing check, bug, security, secrets, PII, data loss) →
              one issue each, labels `code-review,blocking`
            - 🟡 **improvement** (refactor, missing tests, quotas, design) → one issue each,
              labels `code-review,enhancement`
            - 🔵 **nits** (naming, dead code, comments, style) → ONE combined issue for all
              nits, labels `code-review,nits`

            First list the open review issues for this PR so a re-review does not file
            duplicates:

              gh issue list --repo ${{ github.repository }} --label code-review --state open --search "PR #${{ steps.pr_context.outputs.pr_number }} in:body" --json number,title

            Skip a finding that an open issue already covers (link that issue instead).

            For each issue, write the body to a file with the Write tool (e.g.
            issue-1.md), then run:

              gh issue create --repo ${{ github.repository }} --title "<concise title>" --label "code-review,blocking" --body-file issue-1.md

            Body format (keep the first line exactly; it links the issue to the PR):

              Found during Claude review of PR #${{ steps.pr_context.outputs.pr_number }} (${{ steps.pr_context.outputs.head_sha }}).

              **Base branch:** ${{ steps.pr_context.outputs.base_ref }}

              ## Problem
              <what is wrong, and the realistic case where it breaks>

              ## Suggested fix
              <the change, and the test that would pin it>

              ## Context
              **File:** `path/to/file.js`, lines N–M
              ```js
              <the relevant ≤25 lines, copied from the file>
              ```

            For the nits issue, use the same first line, then a checklist with one
            `- [ ]` item per nit (file, lines, what to change). Never write "@claude"
            in an issue; the owner adds it when they want Claude to fix one.

            ### Step 2 — Post one review comment on the PR

            Write the comment to review.md with the Write tool, then run:

              gh pr comment ${{ steps.pr_context.outputs.pr_number }} --body-file review.md --repo ${{ github.repository }}

            Structure:
            1. **Summary** — 1–3 sentences.
            2. **Coverage table** — one row per category: `| Category | Status | Note |`
               using 🔴 bug/blocking, 🟡 improvement, 🔵 nit, ✅ clean. Every row present.
               The CI row names each check and its result. Link the issue in the note
               (`#N`) for every non-✅ row.
            3. **Findings** — grouped by severity, each as
               `[Category] path/to/file.js lines N–M — what is wrong and the fix (#N)`.
            4. **Verdict** — Approved / Needs changes / Needs discussion.

            Do not push commits, edit code, comment on issues or approve the PR.

          # The list is quoted inside the string: unquoted, the shell splits it at the spaces in
          # "Bash(gh pr diff:*)" and every tool is denied. Write creates the --body-file.
          claude_args: '--allowedTools "Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment:*),Bash(gh issue list:*),Bash(gh issue create:*),Read,Write,Glob,Grep"'
          # Keep the agent transcript in the job log so a silent failure can be diagnosed.
          show_full_output: true
