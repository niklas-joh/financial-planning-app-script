name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commitlint:
    name: Commit convention (PR title)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Lint PR title
        # PRs are squash-merged, so the title becomes the commit message on main.
        # Pass it via env so a crafted title cannot inject shell commands.
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: echo "$PR_TITLE" | npx commitlint

  lint:
    name: ESLint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx eslint . --max-warnings=0

  tests:
    name: Tests (Node, Apps Script fakes)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test -- --verbose

  typecheck:
    name: Type check (JSDoc, baseline)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck

  # Apps Script equivalent of WordPress Plugin Check: push order, manifest,
  # OAuth scopes, duplicate globals, load order and menu handlers. On PRs it
  # also posts a sticky summary comment with deltas against the base branch.
  apps-script-check:
    name: Apps Script check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write # sticky summary comment
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: npm
      - run: npm ci --no-audit --no-fund

      - name: Checkout base branch for comparison
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.base_ref }}
          path: base-checkout
          fetch-depth: 1

      - name: Run check
        id: check
        # base_ref is user-controlled (the PR's target branch): pass via env.
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: |
          set +e
          node scripts/check-manifest.mjs --markdown apps-script-check.md --base base-checkout --base-ref "$BASE_REF"
          echo "status=$?" >> "$GITHUB_OUTPUT"
          cat apps-script-check.md >> "$GITHUB_STEP_SUMMARY"

      - name: Post summary (sticky — updates in place)
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: apps-script-check
          path: apps-script-check.md

      - name: Fail on problems
        if: steps.check.outputs.status != '0'
        run: |
          echo "::error::Apps Script check found problems — see the job summary or the PR comment."
          exit 1
