# Installed as ~/categoriser/docker-compose.yml by scripts/install-schedule.sh.
# Uses the prebuilt image only, so the scheduled job never reads the repo.
services:
  categoriser:
    image: categoriser:local
    env_file: .env
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /app/credentials/service-account.json
    volumes:
      - ./credentials:/app/credentials:ro
      - ./data:/app/data
      - ./models:/app/models
    command: ["python", "-m", "categoriser.run"]
    restart: "no"
