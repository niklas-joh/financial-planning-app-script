[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "categoriser"
version = "0.1.0"
description = "Categorises Bank Sync transactions into a separate 'categorised' sheet."
requires-python = ">=3.12"
dependencies = [
  "pandas>=2.2",
  "scikit-learn==1.9.1",  # exact: a saved model only loads with the version that trained it
  "joblib>=1.3",  # saves and loads the model (also a scikit-learn dependency)
  "gspread>=6.1",
  "google-auth>=2.30",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
